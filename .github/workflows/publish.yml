name: Publicar en npm

# Publica con Trusted Publishing (OIDC): no hay token de npm guardado en ningun sitio.
# Se dispara solo al empujar un tag vX.Y.Z, y exige que el tag coincida con package.json.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # imprescindible: GitHub emite el token OIDC que npm canjea
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # nunca cachear en un build de release
      - name: El tag tiene que coincidir con la version de package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::El tag v$TAG no coincide con la version $VER de package.json"
            exit 1
          fi
      - name: Publicar
        run: npm publish --access public
